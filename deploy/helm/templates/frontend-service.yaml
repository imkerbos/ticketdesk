apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      # 开发模式下容器里跑的是 vite dev server（3100），不是 nginx（80）
      targetPort: {{ ternary 3100 80 (and (.Values.frontend.dev | default dict).enabled true) }}
