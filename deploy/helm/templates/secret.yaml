apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "ticketdesk.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /*
    setup token：优先用 values 里显式指定的；否则复用集群里已有的那个，
    都没有才新生成。lookup 这一步不能省 —— 否则每次 helm upgrade 都会
    重新随机，把一个还没做完初始化的实例的令牌换掉。
  */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" .Release.Name) }}
  {{- $token := .Values.setup.token }}
  {{- if not $token }}
    {{- if and $existing $existing.data (index $existing.data "setup-token") }}
      {{- $token = index $existing.data "setup-token" | b64dec }}
    {{- else }}
      {{- $token = randAlphaNum 32 }}
    {{- end }}
  {{- end }}
  setup-token: {{ $token | quote }}
  jwt-secret: {{ .Values.jwt.secret | quote }}
  db-password: {{ include "ticketdesk.mysql.password" . | quote }}
  db-root-password: {{ .Values.mysql.rootPassword | quote }}
  redis-password: {{ include "ticketdesk.redis.password" . | quote }}
  {{- if eq .Values.storage.driver "s3" }}
  s3-access-key: {{ .Values.storage.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.s3.secretKey | quote }}
  {{- end }}
  {{- if .Values.nightingale.enabled }}
  n9e-token: {{ .Values.nightingale.token | quote }}
  {{- end }}
