name: ticketdesk-dev

services:
  # 后端服务（开发模式 - 热更新）
  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.backend.dev
    container_name: ticketdesk-backend
    restart: unless-stopped
    ports:
      - "10010:10010"
    volumes:
      # 挂载源码，实现热更新
      - ..:/app
      # Go 模块缓存（持久化，避免每次重新下载）
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      # 排除不需要同步的目录
      - /app/tmp
      - /app/web/node_modules
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10010/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - ticketdesk-network

  # 前端服务（开发模式 - 热更新）
  frontend:
    build:
      context: ../web
      dockerfile: ../deploy/docker/Dockerfile.frontend.dev
      # 复用 host 网络做 build，让 npm install 走 host 的 DNS/代理，
      # 避免容器默认网络解析 registry.npmjs.org 慢/超时导致 build hang
      network: host
    container_name: ticketdesk-frontend
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      # 挂载前端源码
      - ../web:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ticketdesk-network

networks:
  ticketdesk-network:
    name: ticketdesk-network
    driver: bridge

volumes:
  # Go 模块缓存，避免每次重建容器都重新下载依赖
  go-mod-cache:
  go-build-cache:
  frontend_node_modules:
