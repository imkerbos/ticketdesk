# TicketDesk 配置文件模板
# 生产部署时：cp config-example.yaml config.yaml 并修改配置

app:
  name: ticketdesk
  env: development  # development, staging, production
  port: 8080
  debug: true
  # 可信反向代理网段（CIDR / IP）。只有直连对端落在此列表内时，
  # 才采信 X-Forwarded-For 推导客户端 IP（限流与审计日志依赖它）。
  # 留空 = 使用默认内网网段（127.0.0.1/32, ::1/128, 10/8, 172.16/12, 192.168/16, fc00::/7），
  # 覆盖 Docker / K8s Ingress 场景。切勿填 0.0.0.0/0。
  # trusted_proxies:
  #   - 10.42.0.0/16

# 数据库配置
database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: your-password
  name: ticketdesk
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # 秒

# 文件存储配置
# driver: local = 本地目录（仅适用于单副本部署，K8s 上依赖 RWO PVC）
#         s3    = S3 兼容对象存储，后端无状态化，多副本可随意扩
#                 兼容 MinIO / AWS S3 / 阿里云 OSS / 腾讯 COS / GCS 互操作模式
storage:
  driver: local
  local_path: ./uploads
  # driver 为 s3 时生效
  s3:
    endpoint: ""        # 不带协议，如 minio:9000 / oss-cn-hangzhou.aliyuncs.com
    bucket: ticketdesk
    region: ""
    access_key: ""
    secret_key: ""
    use_ssl: true
    path_style: false   # MinIO 等自建网关需设为 true
    prefix: ""          # 多环境共用一个 bucket 时的键前缀

# Redis 配置
redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 10

# JWT 配置
jwt:
  secret: your-secret-key-change-in-production
  access_expire: 7200      # Access Token 有效期（秒）- 2小时
  refresh_expire: 604800   # Refresh Token 有效期（秒）- 7天
  issuer: ticketdesk

# 日志配置
log:
  level: info              # debug, info, warn, error
  format: json             # json, console
  output: stdout           # stdout, file
  file_path: logs/app.log
  max_size: 100            # MB
  max_backups: 3
  max_age: 7               # 天
  compress: true
