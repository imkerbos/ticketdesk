              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新工作流节点
      tags:
      - Workflow
  /setup:
    post:
      consumes:
      - application/json
      parameters:
      - description: 初始化信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 执行首次初始化
      tags:
      - Setup
  /setup/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
