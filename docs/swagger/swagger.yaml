          $ref: '#/definitions/dto.AlertResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.AlertResolveRequest:
    properties:
      comment:
        maxLength: 500
        type: string
    type: object
  dto.AlertResponse:
    properties:
      ack_at:
        type: string
      ack_by:
        type: integer
      ack_by_name:
        type: string
      alert_name:
        type: string
      annotations:
        additionalProperties:
          type: string
        type: object
      created_at:
        type: string
      ends_at:
        type: string
      fingerprint:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      issue_key:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      resolved_at:
        type: string
      resolved_by:
        type: integer
      resolved_by_name:
        type: string
      severity:
        type: string
      source:
        type: string
      starts_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.AlertRuleListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AlertRuleResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.AlertRuleResponse:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
      auto_resolve:
        type: boolean
      created_at:
        type: string
      datasource_id:
        type: integer
      datasource_name:
        type: string
      description:
        type: string
      id:
        type: integer
      issue_type_id:
        type: integer
      issue_type_name:
        type: string
      label_matchers:
        items:
          $ref: '#/definitions/dto.LabelMatcher'
        type: array
      merge_window:
        type: integer
      name:
        type: string
      priority:
        type: string
      project_id:
        type: integer
      project_key:
        type: string
      project_name:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.AlertSilenceListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AlertSilenceResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.AlertSilenceResponse:
    properties:
      comment:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      created_by_name:
        type: string
      description:
        type: string
      ends_at:
        type: string
      id:
        type: integer
      label_matchers:
        items:
          $ref: '#/definitions/dto.LabelMatcher'
        type: array
      name:
        type: string
      silence_type:
        type: integer
      starts_at:
        type: string
      status:
        type: integer
      updated_at:
        type: string
    type: object
  dto.AlertTimelineItem:
    properties:
      date:
        description: 日期
        type: string
      firing:
        description: 触发数量
        type: integer
      resolved:
        description: 恢复数量
        type: integer
    type: object
  dto.AlertWebhookAlertItem:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      startsAt:
        type: string
      status:
        description: firing, resolved
        type: string
    type: object
  dto.AlertWebhookRequest:
    properties:
      alerts:
        items:
          $ref: '#/definitions/dto.AlertWebhookAlertItem'
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        type: object
      commonLabels:
        additionalProperties:
          type: string
        type: object
      externalURL:
        type: string
      groupKey:
        type: string
      groupLabels:
        additionalProperties:
          type: string
        type: object
      receiver:
        type: string
      status:
        description: firing, resolved
        type: string
      truncatedAlerts:
        type: integer
      version:
        type: string
    type: object
  dto.ApprovalRecordResponse:
    properties:
      approved_at:
        type: string
      approver_id:
        type: integer
      approver_name:
        type: string
      comment:
        type: string
      created_at:
        type: string
      id:
        type: integer
      instance_id:
        type: integer
      node_id:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.ApproveRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
    type: object
  dto.AssignIssueRequest:
    properties:
      assignee_id:
        type: integer
    required:
    - assignee_id
    type: object
  dto.AssigneeSummary:
    properties:
      assignee_id:
        type: integer
      assignee_name:
        type: string
      completed:
        type: integer
      in_progress:
        type: integer
      total:
        type: integer
    type: object
  dto.AttachmentResponse:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      id:
        type: integer
      is_image:
        type: boolean
      issue_id:
        type: integer
      uploaded_by:
        type: integer
      uploader:
        $ref: '#/definitions/internal_core-issue_dto.UserBrief'
    type: object
  dto.BatchUpdateConfigRequest:
    properties:
      configs:
        additionalProperties:
          type: string
        type: object
    required:
    - configs
    type: object
  dto.BrandConfig:
    properties:
      copyright_text:
        type: string
      favicon_url:
        type: string
      login_description:
        type: string
      login_title:
        type: string
      logo_url:
        type: string
      system_description:
        type: string
      system_name:
        type: string
    type: object
  dto.CategoryResponse:
    properties:
      color:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      is_system:
        type: boolean
      label:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  dto.CommentResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      updated_at:
        type: string
      user:
        $ref: '#/definitions/internal_core-issue_dto.UserBrief'
      user_id:
        type: integer
    type: object
  dto.CompleteRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
      result:
        description: 条件表达式值（如 approved, rejected, 或自定义条件名称），空=默认流转
        type: string
    type: object
  dto.ComponentResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      lead_user:
        $ref: '#/definitions/internal_core-field_dto.UserBrief'
      lead_user_id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ConfigResponse:
    properties:
      category:
        type: string
      config_key:
        type: string
      config_type:
        type: string
      config_value:
        description: 敏感配置会隐藏值
        type: string
      description:
        type: string
      id:
        type: integer
      is_secret:
        type: boolean
      updated_at:
        type: string
      updated_by:
        type: integer
    type: object
  dto.ConvertToIssueRequest:
    properties:
      assignee_id:
        type: integer
      issue_type_id:
        type: integer
      project_key:
        type: string
    required:
    - issue_type_id
    - project_key
    type: object
  dto.CreateAlertRuleRequest:
    properties:
      assignee_id:
        type: integer
      auto_resolve:
        type: boolean
      datasource_id:
        type: integer
      description:
        maxLength: 500
        type: string
      issue_type_id:
        type: integer
      label_matchers:
        items:
          $ref: '#/definitions/dto.LabelMatcher'
        minItems: 1
        type: array
      merge_window:
        description: 合并窗口（秒），0表示不合并
        minimum: 0
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      priority:
        enum:
        - P0
        - P1
        - P2
        - P3
        type: string
      project_id:
        type: integer
    required:
    - datasource_id
    - issue_type_id
    - label_matchers
    - name
    - priority
    - project_id
    type: object
  dto.CreateAlertSilenceRequest:
    properties:
      comment:
        maxLength: 500
        type: string
      description:
        maxLength: 500
        type: string
      ends_at:
        description: 预约静默必填
        type: string
      label_matchers:
        items:
          $ref: '#/definitions/dto.LabelMatcher'
        minItems: 1
        type: array
      name:
        maxLength: 100
        minLength: 1
        type: string
      silence_type:
        description: 1-即时静默, 2-预约静默
        enum:
        - 1
        - 2
        type: integer
      starts_at:
        description: 预约静默必填
        type: string
    required:
    - label_matchers
    - name
    - silence_type
    type: object
  dto.CreateCategoryRequest:
    properties:
      color:
        enum:
        - primary
        - success
        - danger
        - warning
        - info
        type: string
      label:
        maxLength: 50
        minLength: 1
        type: string
      name:
        maxLength: 30
        minLength: 1
        type: string
    required:
    - color
    - label
    - name
    type: object
  dto.CreateCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.CreateComponentRequest:
    properties:
      description:
        maxLength: 500
        type: string
      lead_user_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateDatasourceRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      poll_interval:
        maximum: 3600
        minimum: 5
        type: integer
      push_mode:
        type: boolean
      type:
        enum:
        - prometheus
        - nightingale
        type: string
    required:
    - config
    - name
    - type
    type: object
  dto.CreateEdgeRequest:
    properties:
      condition_expr:
        maxLength: 500
        type: string
      source_node_id:
        type: integer
      target_node_id:
        type: integer
    required:
    - source_node_id
    - target_node_id
    type: object
  dto.CreateFieldRequest:
    properties:
      default_value:
        maxLength: 500
        type: string
      description:
        maxLength: 500
        type: string
      field_key:
        maxLength: 50
        minLength: 2
        type: string
      field_name:
        maxLength: 100
        minLength: 1
        type: string
      field_type:
        enum:
        - text
        - textarea
        - number
        - date
        - datetime
        - select
        - multiselect
        - user
        - multiuser
        - version
        - component
        - label
        - epic_link
        - time_estimate
        - url
        - checkbox
        type: string
      options:
        description: JSON格式的选项配置
        type: string
      validation:
        description: JSON格式的校验规则
        type: string
    required:
    - field_key
    - field_name
    - field_type
    type: object
  dto.CreateIssueRequest:
    properties:
      assignee_id:
        type: integer
      custom_fields:
        items:
          $ref: '#/definitions/internal_core-issue_dto.CustomFieldValue'
        type: array
      description:
        maxLength: 10000
        type: string
      due_date:
        description: '格式: 2006-01-02'
        type: string
      epic_id:
        type: integer
      issue_type_id:
        type: integer
      parent_id:
        type: integer
      planned_end_date:
        description: '格式: 2006-01-02'
        type: string
      planned_start_date:
        description: '格式: 2006-01-02'
        type: string
      priority:
        enum:
        - P0
        - P1
        - P2
        - P3
        type: string
      project_key:
        maxLength: 20
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - issue_type_id
    - project_key
    - title
    type: object
  dto.CreateIssueTypeRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 500
        type: string
      display_name:
        maxLength: 100
        minLength: 1
        type: string
      icon:
        maxLength: 50
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - display_name
    - name
    type: object
  dto.CreateLabelRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 200
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateNodeRequest:
    properties:
      config:
        $ref: '#/definitions/dto.NodeConfig'
      name:
        maxLength: 100
        minLength: 1
        type: string
      node_type:
        enum:
        - start
        - end
        - approval
        - work
        - system
        type: string
      position_x:
        type: integer
      position_y:
        type: integer
    required:
    - name
    - node_type
    type: object
  dto.CreateNotificationChannelRequest:
    properties:
      channel_type:
        enum:
        - lark
        - telegram
        type: string
      config: {}
      enabled:
        type: boolean
      event_types:
        items:
          type: string
        minItems: 1
        type: array
      mention_all:
        type: boolean
      name:
        maxLength: 100
        type: string
    required:
    - channel_type
    - config
    - event_types
    - name
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      lead_user_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      project_key:
        maxLength: 10
        minLength: 2
        type: string
      template:
        description: '"standard" 使用模版（默认），"blank" 空项目'
        type: string
    required:
    - lead_user_id
    - name
    - project_key
    type: object
  dto.CreateProjectRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      role_key:
        maxLength: 50
        minLength: 2
        type: string
      role_name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - role_key
    - role_name
    type: object
  dto.CreateRequirementPoolRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      owner_id:
        type: integer
      project_id:
        type: integer
      type:
        allOf:
        - $ref: '#/definitions/model.RequirementPoolType'
        enum:
        - global
        - project
    required:
    - name
    - owner_id
    - type
    type: object
  dto.CreateRequirementRequest:
    properties:
      assignee_id:
        type: integer
      category:
        $ref: '#/definitions/model.RequirementCategory'
      description:
        maxLength: 10000
        type: string
      end_date:
        description: '格式: 2006-01-02 或 2006-01-02 15:04:05'
        type: string
      pool_id:
        type: integer
      priority:
        allOf:
        - $ref: '#/definitions/model.RequirementPriority'
        enum:
        - P0
        - P1
        - P2
        - P3
      reporter_id:
        type: integer
      start_date:
        description: '格式: 2006-01-02 或 2006-01-02 15:04:05'
        type: string
      tags:
        items:
          type: string
        type: array
      target_project_id:
        type: integer
      title:
        maxLength: 500
        minLength: 1
        type: string
    required:
    - category
    - pool_id
    - priority
    - title
    type: object
  dto.CreateTokenRequest:
    properties:
      expires_in:
        description: 秒数, 0 = 永久
        minimum: 0
        type: integer
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.CreateTokenResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      name:
        type: string
      prefix:
        type: string
      token:
        description: 一次性明文，只在创建时返回
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      display_name:
        maxLength: 100
        type: string
      email:
        maxLength: 100
        type: string
      password:
        maxLength: 50
        minLength: 6
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        enum:
        - 0
        - 1
        type: integer
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.CreateVersionRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      release_date:
        description: '格式: 2006-01-02'
        type: string
    required:
    - name
    type: object
  dto.CreateWebhookRequest:
    properties:
      description:
        type: string
      events:
        items:
          type: string
        minItems: 1
        type: array
      headers:
        additionalProperties:
          type: string
        type: object
      name:
        maxLength: 100
        type: string
      secret:
        type: string
      url:
        maxLength: 500
        type: string
    required:
    - events
    - name
    - url
    type: object
  dto.CreateWorkflowRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      project_id:
        type: integer
    required:
    - name
    type: object
  dto.CreateWorkflowSchemeRequest:
    properties:
      issue_type_id:
        type: integer
      workflow_id:
        type: integer
    required:
    - issue_type_id
    - workflow_id
    type: object
  dto.CreateWorklogRequest:
    properties:
      description:
        maxLength: 5000
        minLength: 1
        type: string
      time_spent:
        description: 格式：2h 30m, 1d 4h, 30m
        type: string
      work_type:
        maxLength: 30
        type: string
      worked_at:
        description: ISO 8601 格式
        type: string
    required:
    - description
    - time_spent
    - worked_at
    type: object
  dto.CustomFieldResponse:
    properties:
      display_value:
        type: string
      field_id:
        type: integer
      field_key:
        type: string
      field_name:
        type: string
      field_type:
        type: string
      value: {}
    type: object
  dto.DailyWorklogStat:
    properties:
      date:
        type: string
      entry_count:
        type: integer
      total_time_sec:
        type: integer
    type: object
  dto.DashboardStatsResponse:
    properties:
      alert_stats:
        description: 告警统计
        properties:
          today_created:
            description: 今日告警
            type: integer
          total_acked:
            description: 已确认告警
            type: integer
          total_firing:
            description: 触发中告警
            type: integer
          total_resolved:
            description: 已恢复告警
            type: integer
          week_created:
            description: 本周告警
            type: integer
        type: object
      issue_stats:
        description: 工单统计
        properties:
          today_created:
            description: 今日创建
            type: integer
          total_closed:
            description: 已关闭工单
            type: integer
          total_in_progress:
            description: 进行中工单
            type: integer
          total_open:
            description: 待处理工单
            type: integer
          total_resolved:
            description: 已解决工单
            type: integer
          week_created:
            description: 本周创建
            type: integer
          week_resolved:
            description: 本周解决
            type: integer
        type: object
      project_stats:
        description: 项目统计
        properties:
          total_members:
            description: 总成员数
            type: integer
          total_projects:
            description: 总项目数
            type: integer
        type: object
    type: object
  dto.DatasourceListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.DatasourceResponse'
        type: array
      page:
