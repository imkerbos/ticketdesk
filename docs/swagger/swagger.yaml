info:
  contact:
    name: TicketDesk
    url: https://github.com/imkerbos/TicketDesk
  description: |-
    项目化工单与告警联动系统 API. 一切问题都是工单, 一切告警都必须被跟进.
    **统一响应格式**: `{code, message, data}`. 错误响应 `{code, message, details?}` (code 为字符串如 "BAD_REQUEST" / "UNAUTHORIZED").
    **速率限制**: 全站默认 300 req/min/IP, /auth/* 端点 20 req/min/IP, /webhook/* 100 req/min/IP. 超出返回 **429 Too Many Requests**, 此状态码在所有端点皆可能出现, 单独 endpoint 文档不重复声明.
  license:
    name: MIT
  termsOfService: https://github.com/imkerbos/TicketDesk
  title: TicketDesk API
  version: "1.0"
paths:
  /api/v1/activities:
    get:
      consumes:
      - application/json
      description: 分页查询活动日志列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 实体类型
        in: query
        name: entity_type
        type: string
      - description: 实体标识
        in: query
        name: entity_key
        type: string
      - description: 实体 ID
        in: query
        name: entity_id
        type: integer
      - description: 用户 ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.ActivityResponse'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: 查询活动列表
      tags:
      - Activity
